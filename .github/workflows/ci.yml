name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  python:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.10"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements.txt ruff pip-audit
      - run: python -m unittest discover -s tests -v
      - run: ruff check backend frontend tests aksh.py scripts
      - run: pip-audit -r requirements.txt
      - run: python scripts/check_public_repo.py

  cloudflare-worker:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infrastructure/cloudflare/discovery-worker
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: infrastructure/cloudflare/discovery-worker/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm audit --audit-level=high

  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend/mobile/android
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - run: node --test gesture_tests.mjs
      - run: chmod +x gradlew
      - run: ./gradlew testDebugUnitTest lintDebug assembleDebug
